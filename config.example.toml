# ntfy -> Jev -> Hermes bridge. Copy to config.toml and adjust.
# Policy sections ([policy], [sources.*], [digest], [outbox], [fallback], [hermes] routes, typesafe.model)
# hot-reload after validation; ntfy/network/database/secret/endpoint changes need a restart.

[bridge]
mode = "shadow"                 # shadow -> guarded -> full
database = "bridge.db"
env_file = ".env"               # KEY=VALUE secrets; must be chmod 600
timezone = "America/New_York"
log_level = "INFO"
log_format = "auto"             # JSON when stderr is not a terminal; "json" or "text" to force
workers = 8

[ntfy]
base_url = "http://ntfy.lan"
token_env = ""                  # e.g. "NTFY_TOKEN" for access-controlled topics
initial_since = ""              # first start only: "" (new messages), "all", or a duration like "12h"

[[ntfy.topics]]
name = "changedetection"
source = "changedetection"
normalizer = "changedetection"

# [[ntfy.topics]]
# name = "truenas"
# normalizer = "generic"

[typesafe]
# Enabling Jev sends redacted, bounded excerpts to TypeSafe's cloud API. Read README "TypeSafe data boundary".
enabled = false
accept_cloud_data_boundary = false
model = "jev-1.13.0"            # pinned; never a moving alias without replaying the labeled corpus
api_key_env = "TYPESAFE_API"
timeout_seconds = 8
max_retries = 3
excerpt_chars = 2000

[hermes]
base_url = "http://127.0.0.1:8644"
secret_env = "HERMES_WEBHOOK_SECRET"
compose_route = "notification-compose"
review_route = "notification-review"
digest_route = "notification-digest"

[outbox]
max_attempts = 8
base_backoff_seconds = 5
max_backoff_seconds = 900

[fallback]
ntfy_topic = ""                 # e.g. "alerts-clean": direct ntfy alert when Hermes rejects a critical event
after_attempts = 3

[digest]
schedule = ["08:00", "18:00"]

[policy]
version = "2026-09-24.1"        # bump on every policy edit; recorded with each decision
echo_tags = ["hermes-bridge"]
test_tags = []
stale_after_seconds = 3600
dedupe_window_seconds = 3600
cooldown_seconds = 1800
fallback_route = "auto"         # when Jev is off/unavailable: priority>=4 -> REVIEW, else DIGEST
min_labels_for_drop = 200
min_critical_labels_for_drop = 30

[policy.thresholds]
notify_harm = 0.80
notify_category_confidence = 0.70
notify_categories = ["security", "data_integrity"]
drop_routine_noise = 0.90
drop_max_harm = 0.20
drop_max_digest_value = 0.35
drop_max_relevance = 0.35
digest_value = 0.65
digest_relevance = 0.65

[policy.user_policy]
immediate = ["security compromise", "data loss risk", "backup failure", "service outage"]
digest = ["software updates", "routine changes", "completed maintenance"]
noise = ["healthy heartbeats", "routine success", "duplicate status"]

[policy.always_notify]
builtin_signatures = true                       # backup failure, pool degraded, corruption, intrusion, UPS/power
signature_exempt_sources = ["changedetection"]  # watched web pages are third-party text
urgent_priority_sources = []                    # sources whose ntfy priority 5 always notifies
# rules = [{ source = "truenas", event_kind = "notification" }]
# signatures = [{ name = "cert_expiry", pattern = "certificate .* expires in [0-3] days", sources = ["caddy"] }]

[policy.always_drop]
fingerprints = []               # exact fingerprints from `ntfy-bridge events explain`, user-approved only

[policy.redaction]
redact_emails = true
patterns = []

# Per-source overrides (FR-15)
# [sources.changedetection]
# local_only = false
# thresholds = { digest_value = 0.70 }

[health]
listen = "127.0.0.1:9464"       # /healthz and /metrics; "" disables
ingest_outage_seconds = 300
delivery_outage_seconds = 600

[retention]
days = 90

[network]
ca_file = ""                    # PEM trust anchor for self-signed ntfy/Hermes HTTPS, relative to this file
extra_allowed_hosts = []        # non-private hostnames explicitly allowed for ntfy/Hermes
